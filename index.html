
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenvix</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(700px, 100%);
      margin: auto;
      padding: 20px;
    }

    .panel {
      background: #1b2940;
      border: 1px solid #30415e;
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
    }

    h1 {
      text-align: center;
      color: #71d6ff;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
    }

    input {
      background: #f1f5f9;
      color: #111;
    }

    button {
      background: #168bd0;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button.google {
      background: white;
      color: #222;
    }

    button.logout {
      background: #9b3545;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #chatPanel, #appPanel {
      display: none;
    }

    #messages {
      height: 340px;
      overflow-y: auto;
      background: #101827;
      border-radius: 10px;
      padding: 12px;
    }

    .message {
      background: #263954;
      padding: 10px;
      margin: 8px 0;
      border-radius: 9px;
      overflow-wrap: anywhere;
    }

    .message strong {
      color: #71d6ff;
    }

    .small {
      color: #b8c3d6;
      font-size: 13px;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    #status {
      color: #ffd166;
      text-align: center;
      overflow-wrap: anywhere;
    }

    #diagnostics {
      background: #101827;
      border-radius: 9px;
      padding: 12px;
      margin-top: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.6;
      color: #b8e8ff;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>ZENVIX</h1>
    <p style="text-align:center">
      Your world. Your people. Your space.
    </p>

    <section class="panel" id="loginPanel">
      <h2>Welcome to Zenvix</h2>

      <input
        id="displayName"
        maxlength="50"
        placeholder="Enter your name"
      >

      <button id="guestButton">
        Continue as Guest
      </button>

      <button id="googleButton" class="google">
        Continue with Google
      </button>

      <p id="loginStatus" class="small"></p>

      <h3>Login Diagnostics</h3>
      <div id="diagnostics">Zenvix started. Waiting for login...</div>
    </section>

    <section class="panel" id="appPanel">
      <p id="welcome"></p>
      <button id="logoutButton" class="logout">
        Logout
      </button>
    </section>

    <section class="panel" id="chatPanel">
      <h2>Public Chat</h2>

      <div id="messages"></div>

      <input
        id="messageInput"
        maxlength="2000"
        placeholder="Write your message..."
      >

      <button id="sendButton">
        Send Message
      </button>

      <p id="chatStatus" class="small"></p>
    </section>

    <p id="status"></p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCIgG9MMxLlvuMM9MavvMTrAQPuYZ6a2Ds",
      authDomain: "livechat2026-51a85.firebaseapp.com",
      databaseURL: "https://livechat2026-51a85-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "livechat2026-51a85",
      storageBucket: "livechat2026-51a85.firebasestorage.app",
      messagingSenderId: "467836802450",
      appId: "1:467836802450:web:c9c48f316fcf3bf4d4dd4b",
      measurementId: "G-LXL179GDDP"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.database();

    const $ = id => document.getElementById(id);

    let currentUser = null;
    let currentName = "";
    let messagesQuery = null;
    let messagesListener = null;

    function diagnostic(message) {
      const box = $("diagnostics");
      const time = new Date().toLocaleTimeString();

      box.textContent +=
        "\n[" + time + "] " + message;

      box.scrollTop = box.scrollHeight;
    }

    function showError(element, error) {
      const code = error.code || "No error code";
      const message = error.message || "Unknown error";

      $(element).textContent =
        "Error: " + code + " - " + message;

      diagnostic("ERROR: " + code + " - " + message);
    }

    function showLogin() {
      $("loginPanel").style.display = "block";
      $("appPanel").style.display = "none";
      $("chatPanel").style.display = "none";
    }

    function showApp() {
      $("loginPanel").style.display = "none";
      $("appPanel").style.display = "block";
      $("chatPanel").style.display = "block";
    }

    function stopMessages() {
      if (messagesQuery && messagesListener) {
        messagesQuery.off("value", messagesListener);
      }

      messagesQuery = null;
      messagesListener = null;
    }

    // GUEST LOGIN
    $("guestButton").onclick = async () => {
      const name = $("displayName").value.trim();

      if (!name) {
        $("loginStatus").textContent =
          "Please enter your name.";
        return;
      }

      $("guestButton").disabled = true;
      $("loginStatus").textContent =
        "Connecting as Guest...";

      diagnostic("Guest Login button clicked.");

      try {
        localStorage.setItem("zenvixGuestName", name);

        await auth.signInAnonymously();

        diagnostic("Guest authentication request completed.");

      } catch (error) {
        showError("loginStatus", error);
      } finally {
        $("guestButton").disabled = false;
      }
    };

    // GOOGLE LOGIN - POPUP METHOD
    $("googleButton").onclick = () => {
      $("googleButton").disabled = true;
      $("loginStatus").textContent =
        "Opening Google account selection...";

      diagnostic("Google Login button clicked.");
      diagnostic("Starting Google sign-in with popup.");

      const provider =
        new firebase.auth.GoogleAuthProvider();

      provider.setCustomParameters({
        prompt: "select_account"
      });

      auth.signInWithPopup(provider)
        .then(result => {
          diagnostic("Google popup returned successfully.");

          if (result.user) {
            diagnostic(
              "Firebase received user: " +
              (result.user.email || result.user.uid)
            );

            $("loginStatus").textContent =
              "Google Login successful.";
          }
        })
        .catch(error => {
          showError("loginStatus", error);
        })
        .finally(() => {
          $("googleButton").disabled = false;
        });
    };

    // AUTHENTICATION STATE
    auth.onAuthStateChanged(async user => {
      stopMessages();

      if (!user) {
        currentUser = null;
        currentName = "";

        showLogin();

        $("status").textContent = "";
        diagnostic("Firebase auth state: No user signed in.");

        return;
      }

      currentUser = user;

      currentName = user.isAnonymous
        ? (localStorage.getItem("zenvixGuestName") || "Guest")
        : (user.displayName || "Zenvix Member");

      diagnostic(
        "Firebase auth state: User signed in. " +
        "Type: " +
        (user.isAnonymous ? "Guest" : "Google/Registered")
      );

      if (user.email) {
        diagnostic("Account email: " + user.email);
      }

      showApp();

      $("welcome").textContent =
        "Welcome, " + currentName;

      try {
        await db.ref("users/" + user.uid).update({
          uid: user.uid,
          name: currentName,
          updatedAt:
            firebase.database.ServerValue.TIMESTAMP
        });

        $("status").textContent =
          user.isAnonymous
            ? "Connected as Guest."
            : "Connected with Google.";

        diagnostic("User profile saved to database.");

        startMessages();

      } catch (error) {
        showError("status", error);
      }
    }, error => {
      showError("loginStatus", error);
      diagnostic("Authentication state listener failed.");
    });

    // PUBLIC CHAT
    function startMessages() {
      stopMessages();

      messagesQuery = db.ref("messages").limitToLast(100);

      messagesListener = snapshot => {
        const box = $("messages");
        box.innerHTML = "";

        snapshot.forEach(child => {
          const msg = child.val() || {};

          const item = document.createElement("div");
          item.className = "message";

          const name = document.createElement("strong");
          name.textContent = msg.name || "Member";

          const content = document.createElement("div");
          content.textContent = msg.text || "";

          const time = document.createElement("div");
          time.className = "small";

          time.textContent = msg.timestamp
            ? new Date(msg.timestamp).toLocaleString()
            : "";

          item.append(name, content, time);
          box.appendChild(item);
        });

        box.scrollTop = box.scrollHeight;
      };

      messagesQuery.on(
        "value",
        messagesListener,
        error => showError("chatStatus", error)
      );

      diagnostic("Public Chat listener started.");
    }

    // SEND MESSAGE
    async function sendMessage() {
      const text = $("messageInput").value.trim();

      if (!currentUser || !text) return;

      $("sendButton").disabled = true;
      $("chatStatus").textContent = "Sending...";

      try {
        await db.ref("messages").push({
          uid: currentUser.uid,
          name: currentName,
          text: text,
          timestamp:
            firebase.database.ServerValue.TIMESTAMP
        });

        $("messageInput").value = "";
        $("chatStatus").textContent = "Message sent.";

      } catch (error) {
        showError("chatStatus", error);
      } finally {
        $("sendButton").disabled = false;
      }
    }

    $("sendButton").onclick = sendMessage;

    $("messageInput").addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter") {
          sendMessage();
        }
      }
    );

    // LOGOUT
    $("logoutButton").onclick = async () => {
      try {
        stopMessages();

        await auth.signOut();

        currentUser = null;
        currentName = "";

        showLogin();

        $("status").textContent =
          "You have logged out.";

        diagnostic("User logged out.");

      } catch (error) {
        showError("status", error);
      }
    };

    diagnostic("Firebase initialized.");
  </script>

<!-- 04. DASHBOARD CONTENT -->
<!-- ====================================== -->

<script>
(function () {
  const appPanel = document.getElementById("appPanel");

  if (!appPanel) {
    console.error("Zenvix Dashboard: appPanel not found.");
    return;
  }

  // Prevent adding the dashboard more than once.
  if (document.getElementById("zenvixDashboard")) {
    return;
  }

  const dashboardHTML = `
    <section id="zenvixDashboard">

      <div class="zx-hero">
        <h2>Welcome to Zenvix 👋</h2>
        <p>
          Your world. Your people. Your space.
          Connect with your community.
        </p>
      </div>

      <h3 class="zx-section-title">My Account</h3>

      <div class="zx-profile">
        <div class="zx-avatar" id="zxAvatar">Z</div>

        <div class="zx-profile-info">
          <strong id="zxUserName">Zenvix Member</strong>
          <span id="zxUserEmail">Your account</span>
        </div>
      </div>

      <h3 class="zx-section-title">Explore Zenvix</h3>

      <div class="zx-grid">

        <div class="zx-card">
          <div class="zx-card-icon">🌐</div>
          <strong>Community</strong>
          <p>Meet people and chat in the public room.</p>
        </div>

        <div class="zx-card">
          <div class="zx-card-icon">👥</div>
          <strong>Groups</strong>
          <p>Group conversations and communities.</p>
          <span class="zx-coming">COMING SOON</span>
        </div>

        <div class="zx-card">
          <div class="zx-card-icon">💬</div>
          <strong>Private Chat</strong>
          <p>One-to-one personal messaging.</p>
          <span class="zx-coming">COMING SOON</span>
        </div>

        <div class="zx-card">
          <div class="zx-card-icon">👤</div>
          <strong>My Profile</strong>
          <p>Your account information and identity.</p>
          <span class="zx-coming">BASIC PROFILE</span>
        </div>

      </div>

      <button
        type="button"
        class="zx-community-button"
        id="zxOpenCommunity"
      >
        Open Public Community Chat →
      </button>

      <p class="zx-note">
        Zenvix is growing. More community features
        will be added step by step.
      </p>

    </section>
  `;

  const welcome = document.getElementById("welcome");

  if (welcome) {
    welcome.insertAdjacentHTML("afterend", dashboardHTML);
  } else {
    appPanel.insertAdjacentHTML("afterbegin", dashboardHTML);
  }

  // 05. Show current Firebase account details.
  function updateDashboardProfile() {
    const user = firebase.auth().currentUser;

    if (!user) return;

    const name = user.isAnonymous
      ? (localStorage.getItem("zenvixGuestName") || "Guest")
      : (user.displayName || "Zenvix Member");

    const email = user.email || (
      user.isAnonymous ? "Guest Account" : "Google Account"
    );

    const nameBox = document.getElementById("zxUserName");
    const emailBox = document.getElementById("zxUserEmail");
    const avatarBox = document.getElementById("zxAvatar");

    if (nameBox) nameBox.textContent = name;
    if (emailBox) emailBox.textContent = email;

    if (avatarBox) {
      avatarBox.textContent =
        name.charAt(0).toUpperCase();
    }
  }

  updateDashboardProfile();

  firebase.auth().onAuthStateChanged(function (user) {
    if (user) updateDashboardProfile();
  });

  // 06. Open existing Public Chat.
  const communityButton =
    document.getElementById("zxOpenCommunity");

  if (communityButton) {
    communityButton.addEventListener("click", function () {
      const chatPanel =
        document.getElementById("chatPanel");

      if (chatPanel) {
        chatPanel.style.display = "block";

        chatPanel.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }
    });
  }

  console.log("Zenvix Dashboard loaded successfully.");
})();
</script>
