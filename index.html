  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;

    .container {
      width: min(700px, 100%);

    .panel {
      background: #1b2940;

      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
    }

    h1 {
      text-align: center;
      color: #71d6ff;
    }

    input, button {
      width: 100%;
      padding: 13px;

    }

    input {
      background: #f1f5f9;

    button {

      cursor: pointer;
    }

    button.google {

    button.logout {

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #chatPanel, #appPanel {
      display: none;
    }

    #messages {
      height: 340px;
      overflow-y: auto;

      border-radius: 10px;
      padding: 12px;
    }

    .message {

      margin: 8px 0;
      border-radius: 9px;

    }

    .message strong {

    }

    .small {
      color: #b8c3d6;

      overflow-wrap: anywhere;

      background: #101827;

      margin-top: 15px;

<body>
  <main class="container">
    <h1>ZENVIX</h1>
    <p style="text-align:center">
      Your world. Your people. Your space.
    </p>

    <section class="panel" id="loginPanel">
      <h2>Welcome to Zenvix</h2>

      <input

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCIgG9MMxLlvuMM9MavvMTrAQPuYZ6a2Ds",
      authDomain: "livechat2026-51a85.firebaseapp.com",
      databaseURL: "https://livechat2026-51a85-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "livechat2026-51a85",
      storageBucket: "livechat2026-51a85.firebasestorage.app",
      messagingSenderId: "467836802450",
      appId: "1:467836802450:web:c9c48f316fcf3bf4d4dd4b",
      measurementId: "G-LXL179GDDP"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.database();

    const $ = id => document.getElementById(id);

    let currentUser = null;
    let currentName = "";
    let messagesQuery = null;
    let messagesListener = null;

    function diagnostic(message) {
      const box = $("diagnostics");
      const time = new Date().toLocaleTimeString();

      box.textContent +=
        "\n[" + time + "] " + message;

      box.scrollTop = box.scrollHeight;
    }

    function showError(element, error) {
      const code = error.code || "No error code";
      const message = error.message || "Unknown error";

      $(element).textContent =
        "Error: " + code + " - " + message;

      diagnostic("ERROR: " + code + " - " + message);
    }

    function showLogin() {
      $("loginPanel").style.display = "block";
      $("appPanel").style.display = "none";
      $("chatPanel").style.display = "none";
    }

    function showApp() {
      $("loginPanel").style.display = "none";
      $("appPanel").style.display = "block";
      $("chatPanel").style.display = "block";
    }

    function stopMessages() {
      if (messagesQuery && messagesListener) {
        messagesQuery.off("value", messagesListener);
      }

      messagesQuery = null;
      messagesListener = null;
    }

    // GUEST LOGIN
    $("guestButton").onclick = async () => {
      const name = $("displayName").value.trim();

      if (!name) {
        $("loginStatus").textContent =
          "Please enter your name.";
        return;
      }

      $("guestButton").disabled = true;
      $("loginStatus").textContent =
        "Connecting as Guest...";

      diagnostic("Guest Login button clicked.");

      try {
        localStorage.setItem("zenvixGuestName", name);

        await auth.signInAnonymously();

        diagnostic("Guest authentication request completed.");

      } catch (error) {
        showError("loginStatus", error);
      } finally {
        $("guestButton").disabled = false;
      }
    };

    // GOOGLE LOGIN - POPUP METHOD
    $("googleButton").onclick = () => {
      $("googleButton").disabled = true;
      $("loginStatus").textContent =
        "Opening Google account selection...";

      diagnostic("Google Login button clicked.");
      diagnostic("Starting Google sign-in with popup.");

      const provider =
        new firebase.auth.GoogleAuthProvider();

      provider.setCustomParameters({
        prompt: "select_account"
      });

      auth.signInWithPopup(provider)
        .then(result => {
          diagnostic("Google popup returned successfully.");

          if (result.user) {
            diagnostic(
              "Firebase received user: " +
              (result.user.email || result.user.uid)
            );

            $("loginStatus").textContent =
              "Google Login successful.";
          }
        })
        .catch(error => {
          showError("loginStatus", error);
        })
        .finally(() => {
          $("googleButton").disabled = false;
        });
    };

    // AUTHENTICATION STATE
    auth.onAuthStateChanged(async user => {
      stopMessages();

      if (!user) {
        currentUser = null;
        currentName = "";

        showLogin();

        $("status").textContent = "";
        diagnostic("Firebase auth state: No user signed in.");

        return;
      }

      currentUser = user;

      currentName = user.isAnonymous
        ? (localStorage.getItem("zenvixGuestName") || "Guest")
        : (user.displayName || "Zenvix Member");

      diagnostic(
        "Firebase auth state: User signed in. " +
        "Type: " +
        (user.isAnonymous ? "Guest" : "Google/Registered")
      );

      if (user.email) {
        diagnostic("Account email: " + user.email);
      }

      showApp();

      $("welcome").textContent =
        "Welcome, " + currentName;

      try {
        await db.ref("users/" + user.uid).update({
          uid: user.uid,
          name: currentName,
          updatedAt:
            firebase.database.ServerValue.TIMESTAMP
        });

        $("status").textContent =
          user.isAnonymous
            ? "Connected as Guest."
            : "Connected with Google.";

        diagnostic("User profile saved to database.");

        startMessages();

      } catch (error) {
        showError("status", error);
      }
    }, error => {
      showError("loginStatus", error);
      diagnostic("Authentication state listener failed.");
    });

    // PUBLIC CHAT
    function startMessages() {
      stopMessages();

      messagesQuery = db.ref("messages").limitToLast(100);

      messagesListener = snapshot => {
        const box = $("messages");
        box.innerHTML = "";

        snapshot.forEach(child => {
          const msg = child.val() || {};

          const item = document.createElement("div");
          item.className = "message";

          const name = document.createElement("strong");
          name.textContent = msg.name || "Member";

          const content = document.createElement("div");
          content.textContent = msg.text || "";

          const time = document.createElement("div");
          time.className = "small";

          time.textContent = msg.timestamp
            ? new Date(msg.timestamp).toLocaleString()
            : "";

          item.append(name, content, time);
          box.appendChild(item);
        });

        box.scrollTop = box.scrollHeight;
      };

      messagesQuery.on(
        "value",
        messagesListener,
        error => showError("chatStatus", error)
      );

      diagnostic("Public Chat listener started.");
    }

    // SEND MESSAGE
    async function sendMessage() {
      const text = $("messageInput").value.trim();

      if (!currentUser || !text) return;

      $("sendButton").disabled = true;
      $("chatStatus").textContent = "Sending...";

      try {
        await db.ref("messages").push({
          uid: currentUser.uid,
          name: currentName,
          text: text,
          timestamp:
            firebase.database.ServerValue.TIMESTAMP
        });

        $("messageInput").value = "";
        $("chatStatus").textContent = "Message sent.";

      } catch (error) {
        showError("chatStatus", error);
      } finally {
        $("sendButton").disabled = false;
      }
    }

    $("sendButton").onclick = sendMessage;

    $("messageInput").addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter") {
          sendMessage();
        }
      }
    );

    // LOGOUT
    $("logoutButton").onclick = async () => {
      try {
        stopMessages();

        await auth.signOut();

        currentUser = null;
        currentName = "";

        showLogin();

        $("status").textContent =
          "You have logged out.";

        diagnostic("User logged out.");

      } catch (error) {
        showError("status", error);
      }
    };

    diagnostic("Firebase initialized.");
  </script>

<script>
(function () {
  const appPanel = document.getElementById("appPanel");

  if (!appPanel) {
    console.error("Zenvix Dashboard: appPanel not found.");
    return;
  }

  // Prevent adding the dashboard more than once.
  if (document.getElementById("zenvixDashboard")) {
    return;
  }

  const dashboardHTML = `
    <section id="zenvixDashboard">

      <div class="zx-hero">
        <h2>Welcome to Zenvix 👋</h2>
        <p>
          Your world. Your people. Your space.

        </p>
      </div>

      <h3 class="zx-section-title">My Account</h3>

        <div class="zx-profile-info">
          <strong id="zxUserName">Zenvix Member</strong>
          <span id="zxUserEmail">Your account</span>
        </div>
      </div>

      <h3 class="zx-section-title">Explore Zenvix</h3>

      <div class="zx-grid">

        <div class="zx-card">
          <div class="zx-card-icon">🌐</div>
          <strong>Community</strong>

          <strong>Groups</strong>
          <p>Group conversations and communities.</p>
          <span class="zx-coming">COMING SOON</span>
        </div>

        <div class="zx-card">
          <div class="zx-card-icon">💬</div>
          <strong>Private Chat</strong>
          <p>One-to-one personal messaging.</p>
          <span class="zx-coming">COMING SOON</span>
        </div>

        <div class="zx-card">
          <div class="zx-card-icon">👤</div>
          <strong>My Profile</strong>
          <p>Your account information and identity.</p>
          <span class="zx-coming">BASIC PROFILE</span>
        </div>

      </div>

      <button
        type="button"
        class="zx-community-button"
        id="zxOpenCommunity"
      >
        Open Public Community Chat →
      </button>

      <p class="zx-note">
        Zenvix is growing. More community features
        will be added step by step.
      </p>

    </section>
  `;

  const welcome = document.getElementById("welcome");

  if (welcome) {
    welcome.insertAdjacentHTML("afterend", dashboardHTML);
  } else {
    appPanel.insertAdjacentHTML("afterbegin", dashboardHTML);
  }

  // 05. Show current Firebase account details.
  function updateDashboardProfile() {
    const user = firebase.auth().currentUser;

    if (!user) return;

    const name = user.isAnonymous
      ? (localStorage.getItem("zenvixGuestName") || "Guest")
      : (user.displayName || "Zenvix Member");

    const email = user.email || (
      user.isAnonymous ? "Guest Account" : "Google Account"
    );

    const nameBox = document.getElementById("zxUserName");
    const emailBox = document.getElementById("zxUserEmail");
    const avatarBox = document.getElementById("zxAvatar");

    if (nameBox) nameBox.textContent = name;
    if (emailBox) emailBox.textContent = email;

    if (avatarBox) {
      avatarBox.textContent =
        name.charAt(0).toUpperCase();
    }
  }

  updateDashboardProfile();

  firebase.auth().onAuthStateChanged(function (user) {
    if (user) updateDashboardProfile();
  });

  // 06. Open existing Public Chat.
  const communityButton =
    document.getElementById("zxOpenCommunity");

  if (communityButton) {
    communityButton.addEventListener("click", function () {
      const chatPanel =
        document.getElementById("chatPanel");

      if (chatPanel) {
        chatPanel.style.display = "block";

        chatPanel.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }
    });
  }

  console.log("Zenvix Dashboard loaded successfully.");
})();
</script>

    if (!card) {
      card = document.createElement("div");
      card.id = "zx-profile-card";
      card.innerHTML = `
        <div class="zx-profile-title">My Profile</div>
        <div class="zx-profile-row" id="zx-profile-name"></div>
        <div class="zx-profile-row" id="zx-profile-email"></div>
        <div class="zx-status">
          <span class="zx-dot"></span>
          <span id="zx-profile-status">Connecting...</span>
        </div>
        <div class="zx-lastseen" id="zx-profile-lastseen"></div>
      `;

      const welcome = parent.querySelector("#welcome");
      if (welcome && welcome.parentNode === parent) {
        welcome.insertAdjacentElement("afterend", card);
      } else {
        parent.appendChild(card);
      }
    }

    const name =
      user.displayName ||
      localStorage.getItem("zenvixGuestName") ||
      "Zenvix User";

    document.getElementById("zx-profile-name").textContent =
      "Name: " + name;

    document.getElementById("zx-profile-email").textContent =
      "Email: " + (user.email || "Guest Account");

    const userRef = db.ref("users/" + user.uid);

    userRef.on("value", function (snapshot) {
      const data = snapshot.val() || {};
      const status = document.getElementById("zx-profile-status");
      const lastSeen = document.getElementById("zx-profile-lastseen");

      if (!status || !lastSeen) return;

      if (data.online === true) {
        status.textContent = "Online";
        lastSeen.textContent = "You are currently active.";
      } else {
        status.textContent = "Offline";
        lastSeen.textContent = data.lastSeen
          ? "Last seen: " + new Date(data.lastSeen).toLocaleString()
          : "Last seen: Not available";
      }
    });
  }

  function startPresence(user) {
    if (presenceStartedFor === user.uid) return;
    presenceStartedFor = user.uid;

    const name =
      user.displayName ||
      localStorage.getItem("zenvixGuestName") ||
      "Zenvix User";

    const userRef = db.ref("users/" + user.uid);
    const connectedRef = db.ref(".info/connected");

    connectedRef.on("value", function (snapshot) {
      if (snapshot.val() !== true) return;

      userRef.onDisconnect().update({
        online: false,
        lastSeen: firebase.database.ServerValue.TIMESTAMP
      }).then(function () {
        return userRef.update({
          displayName: name,
          email: user.email || "",
          online: true
        });
      }).catch(function (error) {
        console.error("Zenvix presence error:", error);
      });
    });
  }

  auth.onAuthStateChanged(function (user) {
    if (!user) return;

    startPresence(user);
    showProfile(user);

    if (profileObserver) profileObserver.disconnect();

    profileObserver = new MutationObserver(function () {
      showProfile(user);
    });

    profileObserver.observe(document.body, {
      childList: true,
      subtree: true
    });
  });
})();


// ===== ZENVIX GROUP SYSTEM V3 =====
(function () {
  if (window.zxGroupsStarted) return;
  window.zxGroupsStarted = true;

  let groupListRef = null;
  let groupMessagesRef = null;

  function status(message) {
    const el = document.getElementById("zxGroupStatus");
    if (el) el.textContent = message;
  }

  function makeInterface() {
    const parent = document.getElementById("zenvixDashboard")
      || document.getElementById("appPanel");

    if (!parent || document.getElementById("zxGroupsArea")) return;

    const area = document.createElement("section");
    area.id = "zxGroupsArea";
    area.style.cssText =
      "margin-top:22px;padding:18px;background:#101e32;border:1px solid #304866;border-radius:16px;";

    area.innerHTML = `
      <h2 style="color:#71d6ff">👥 Zenvix Groups</h2>

      <h3>Create Your Group</h3>
      <input id="zxNewGroupName" maxlength="40"
        placeholder="Enter group name">
      <button type="button" id="zxCreateGroup">Create Group</button>

      <hr style="border-color:#304866;margin:20px 0">

      <h3>Join a Group</h3>
      <input id="zxJoinGroupId"
        placeholder="Paste Group ID here">
      <button type="button" id="zxJoinGroup">Join Group</button>

      <p id="zxGroupStatus" class="small"></p>

      <h3 style="color:#71d6ff">My Groups</h3>
      <div id="zxGroupList"></div>

      <div id="zxGroupChat"></div>
    `;

    parent.appendChild(area);

    document.getElementById("zxCreateGroup")
      .onclick = createGroup;

    document.getElementById("zxJoinGroup")
      .onclick = joinGroup;
  }

  async function createGroup() {
    if (!currentUser) {
      status("Please log in first.");
      return;
    }

    const input = document.getElementById("zxNewGroupName");
    const groupName = input.value.trim();

    if (!groupName || groupName.length > 40) {
      status("Enter a group name (maximum 40 characters).");
      return;
    }

    try {
      status("Creating your group...");

      const ref = db.ref("groups").push();

      await ref.set({
        name: groupName,
        owner: currentUser.uid,
        createdAt: Date.now(),
        members: {
          [currentUser.uid]: true
        }
      });

      await db.ref(
        "userGroups/" + currentUser.uid + "/" + ref.key
      ).set(true);

      input.value = "";
      status("Group created successfully! Group ID: " + ref.key);

      loadMyGroups();

    } catch (error) {
      status("Group creation error: " + error.message);
    }
  }

  async function joinGroup() {
    if (!currentUser) {
      status("Please log in first.");
      return;
    }

    const input = document.getElementById("zxJoinGroupId");
    const groupId = input.value.trim();

    if (!groupId) {
      status("Please enter a Group ID.");
      return;
    }

    try {
      status("Checking group...");

      const ref = db.ref("groups/" + groupId);
      const check = await ref.once("value");

      if (!check.exists()) {
        status("This Group ID was not found.");
        return;
      }

      await ref.child("members/" + currentUser.uid).set(true);

      await db.ref(
        "userGroups/" + currentUser.uid + "/" + groupId
      ).set(true);

      input.value = "";
      status("You successfully joined " + check.val().name);

      loadMyGroups();

    } catch (error) {
      status("Could not join group: " + error.message);
    }
  }

  function loadMyGroups() {
    if (!currentUser) return;

    if (groupListRef) groupListRef.off();

    groupListRef = db.ref("userGroups/" + currentUser.uid);

    groupListRef.on("value", async snapshot => {
      const list = document.getElementById("zxGroupList");
      if (!list) return;

      list.innerHTML = "";

      if (!snapshot.exists()) {
        list.textContent = "No groups yet. Create or join a group.";
        return;
      }

      const ids = [];
      snapshot.forEach(child => ids.push(child.key));

      for (const id of ids) {
        try {
          const groupSnapshot = await db.ref(
            "groups/" + id
          ).once("value");

          if (!groupSnapshot.exists()) continue;

          const group = groupSnapshot.val();

          const card = document.createElement("div");
          card.style.cssText =
            "background:#20334d;padding:12px;margin:10px 0;border-radius:12px;";

          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "👥 " + group.name;
          button.onclick = () => openGroup(id, group.name);

          const idLabel = document.createElement("p");
          idLabel.className = "small";
          idLabel.textContent = "Group ID: " + id;

          const copyButton = document.createElement("button");
          copyButton.type = "button";
          copyButton.textContent = "Copy Group ID";

          copyButton.onclick = async () => {
            try {
              await navigator.clipboard.writeText(id);
              status("Group ID copied!");
            } catch (error) {
              status("Copy failed. Select and copy the Group ID manually.");
            }
          };

          card.append(button, idLabel, copyButton);
          list.appendChild(card);

        } catch (error) {
          console.error("Group loading error:", error);
        }
      }
    }, error => {
      status("Group list error: " + error.message);
    });
  }

  function openGroup(id, groupName) {
    if (groupMessagesRef) {
      groupMessagesRef.off();
      groupMessagesRef = null;
    }

    const chat = document.getElementById("zxGroupChat");
    if (!chat) return;

    chat.innerHTML = `
      <hr style="border-color:#304866;margin:20px 0">
      <h3 style="color:#71d6ff"></h3>
      <div id="zxGroupMessages"
        style="height:280px;overflow-y:auto;background:#0c1627;padding:10px;border-radius:10px;">
      </div>
      <input id="zxGroupMessageInput"
        maxlength="500" placeholder="Write a group message...">
      <button type="button" id="zxGroupSend">Send Message</button>
      <p id="zxGroupSendStatus" class="small"></p>
    `;

    chat.querySelector("h3").textContent = "👥 " + groupName;

    const messages = document.getElementById("zxGroupMessages");

    groupMessagesRef = db.ref(
      "groups/" + id + "/messages"
    ).limitToLast(100);

    groupMessagesRef.on("value", snapshot => {
      messages.innerHTML = "";

      snapshot.forEach(child => {
        const msg = child.val() || {};

        const item = document.createElement("div");
        item.className = "message";

        const sender = document.createElement("strong");
        sender.textContent = msg.name || "Member";

        const content = document.createElement("div");
        content.textContent = msg.text || "";

        const time = document.createElement("div");
        time.className = "small";
        time.textContent = msg.createdAt
          ? new Date(msg.createdAt).toLocaleString()
          : "";

        item.append(sender, content, time);
        messages.appendChild(item);
      });

      messages.scrollTop = messages.scrollHeight;

    }, error => {
      document.getElementById("zxGroupSendStatus").textContent =
        "Chat error: " + error.message;
    });

    async function sendMessage() {
      const input = document.getElementById("zxGroupMessageInput");
      const sendStatus = document.getElementById("zxGroupSendStatus");
      const text = input.value.trim();

      if (!text || !currentUser) return;

      const button = document.getElementById("zxGroupSend");
      button.disabled = true;
      sendStatus.textContent = "Sending...";

      try {
        await db.ref(
          "groups/" + id + "/messages"
        ).push({
          uid: currentUser.uid,
          name: currentName || "Member",
          text: text,
          createdAt: Date.now()
        });

        input.value = "";
        sendStatus.textContent = "Message sent.";

      } catch (error) {
        sendStatus.textContent = "Send failed: " + error.message;

      } finally {
        button.disabled = false;
      }
    }

    document.getElementById("zxGroupSend").onclick = sendMessage;

    document.getElementById("zxGroupMessageInput")
      .addEventListener("keydown", event => {
        if (event.key === "Enter") sendMessage();
      });

    chat.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }

  function stopGroups() {
    if (groupListRef) groupListRef.off();
    if (groupMessagesRef) groupMessagesRef.off();

    groupListRef = null;
    groupMessagesRef = null;
  }

  firebase.auth().onAuthStateChanged(user => {
    if (user) {
      makeInterface();
      loadMyGroups();
    } else {
      stopGroups();

      const area = document.getElementById("zxGroupsArea");
      if (area) area.remove();
    }
  });

  console.log("Zenvix Groups V3 ready.");
})();

// ===== END ZENVIX GROUP SYSTEM V3 =====

<script>
(function () {
  if (window.zxMembersStarted) return;
  window.zxMembersStarted = true;

  const auth = firebase.auth();
  const db = firebase.database();

  let membersRef = null;
  let membersListener = null;
  let connectedListener = null;

  const style = document.createElement("style");
  style.textContent = `
    #zx-members-panel {
      background: #111a32;
      color: white;
      padding: 18px;
      margin: 18px 0;
      border: 1px solid #29395d;
      border-radius: 18px;
      font-family: Arial, sans-serif;
    }
    #zx-members-panel h3 {
      margin: 0 0 14px;
      color: #fff;
    }
    .zx-member-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #29395d;
    }
    .zx-member-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #263b68;
      display: grid;
      place-items: center;
      font-weight: bold;
      color: white;
    }
    .zx-member-info {
      flex: 1;
      min-width: 0;
    }
    .zx-member-name {
      font-weight: bold;
      overflow-wrap: anywhere;
    }
    .zx-member-status {
      font-size: 12px;
      margin-top: 5px;
      color: #aab7d0;
    }
    .zx-online-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      background: #21df86;
      border-radius: 50%;
      margin-right: 5px;
    }
    .zx-offline-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      background: #8791a5;
      border-radius: 50%;
      margin-right: 5px;
    }
  `;
  document.head.appendChild(style);

  function makePanel() {
    const parent =
      document.getElementById("zenvixDashboard") ||
      document.getElementById("appPanel");

    if (!parent) return false;

    if (document.getElementById("zx-members-panel")) return true;

    const panel = document.createElement("div");
    panel.id = "zx-members-panel";
    panel.innerHTML = `
      <h3>Online Members</h3>
      <div id="zx-members-count">Connecting...</div>
      <div id="zx-members-list"></div>
    `;

    parent.appendChild(panel);
    return true;
  }

  function renderMembers(data) {
    makePanel();

    const list = document.getElementById("zx-members-list");
    const count = document.getElementById("zx-members-count");

    if (!list || !count) return;

    list.innerHTML = "";

    const members = Object.entries(data || {})
      .map(([uid, profile]) => ({
        uid: uid,
        name: profile.displayName || "Zenvix User",
        online: profile.online === true,
        lastSeen: profile.lastSeen || null
      }))
      .sort((a, b) => Number(b.online) - Number(a.online));

    const onlineCount = members.filter(m => m.online).length;
    count.textContent =
      onlineCount + " Online • " + members.length + " Members";

    if (!members.length) {
      list.textContent = "No members yet.";
      return;
    }

    members.forEach(function (member) {
      const item = document.createElement("div");
      item.className = "zx-member-item";

      const avatar = document.createElement("div");
      avatar.className = "zx-member-avatar";
      avatar.textContent = member.name.charAt(0).toUpperCase();

      const info = document.createElement("div");
      info.className = "zx-member-info";

      const name = document.createElement("div");
      name.className = "zx-member-name";
      name.textContent = member.name;

      const status = document.createElement("div");
      status.className = "zx-member-status";

      if (member.online) {
        status.innerHTML =
          '<span class="zx-online-dot"></span>Online';
      } else {
        status.innerHTML =
          '<span class="zx-offline-dot"></span>Offline';

        if (member.lastSeen) {
          status.textContent =
            "Last seen: " +
            new Date(member.lastSeen).toLocaleString();
        }
      }

      info.appendChild(name);
      info.appendChild(status);
      item.appendChild(avatar);
      item.appendChild(info);
      list.appendChild(item);
    });
  }

  function startMembers() {
    if (membersRef) return;

    membersRef = db.ref("publicProfiles");
    membersListener = membersRef.on("value", function (snapshot) {
      renderMembers(snapshot.val());
    }, function (error) {
      console.error("Members error:", error);
      const count = document.getElementById("zx-members-count");
      if (count) count.textContent = "Could not load members.";
    });
  }

  function startPresence(user) {
    const name =
      user.displayName ||
      localStorage.getItem("zenvixGuestName") ||
      "Zenvix User";

    const userRef = db.ref("publicProfiles/" + user.uid);
    const connectedRef = db.ref(".info/connected");

    if (connectedListener) {
      connectedRef.off("value", connectedListener);
    }

    connectedListener = function (snapshot) {
      if (snapshot.val() !== true) return;

      userRef.onDisconnect().update({
        online: false,
        lastSeen: firebase.database.ServerValue.TIMESTAMP
      }).then(function () {
        return userRef.update({
          displayName: name,
          online: true
        });
      }).catch(function (error) {
        console.error("Presence error:", error);
      });
    };

    connectedRef.on("value", connectedListener);
  }

  auth.onAuthStateChanged(function (user) {
    if (!user) return;

    startPresence(user);
    startMembers();
    makePanel();

    const observer = new MutationObserver(function () {
      makePanel();
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  });
})();
</script>
