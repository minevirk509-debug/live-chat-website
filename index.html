
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Chat Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }
    h1 { color: #38bdf8; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      background: #0284c7;
      color: white;
      font-weight: bold;
    }
    #messages {
      background: #1e293b;
      height: 300px;
      overflow-y: auto;
      padding: 12px;
      border-radius: 10px;
      text-align: left;
      margin: 15px 0;
    }
    .message {
      padding: 10px;
      margin: 7px 0;
      background: #334155;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
    #status { color: #facc15; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌍 Live Chat</h1>
    <p>Welcome to our chat room!</p>

    <input id="name" placeholder="Enter your name">
    <div id="messages"></div>

    <input id="message" placeholder="Write your message">
    <button id="send">Send Message</button>
    <p id="status">Connecting...</p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "YOUR_DATABASE_URL",
      projectId: "YOUR_PROJECT_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const messages = document.getElementById("messages");
    const status = document.getElementById("status");

    auth.signInAnonymously()
      .then(() => {
        status.textContent = "Connected to chat";
        db.ref("messages").limitToLast(100).on("child_added", snapshot => {
          const data = snapshot.val();
          const item = document.createElement("div");
          item.className = "message";
          item.textContent = data.name + ": " + data.text;
          messages.appendChild(item);
          messages.scrollTop = messages.scrollHeight;
        });
      })
      .catch(error => {
        status.textContent = "Connection error: " + error.message;
      });

    document.getElementById("send").onclick = async () => {
      const name = document.getElementById("name").value.trim();
      const message = document.getElementById("message").value.trim();

      if (!name || !message) {
        alert("Enter your name and message");
        return;
      }

      if (!auth.currentUser) {
        alert("Chat is not connected yet");
        return;
      }

      await db.ref("messages").push({
        name: name,
        text: message,
        time: Date.now()
      });

      document.getElementById("message").value = "";
    };
  </script>
</body>
</html>
